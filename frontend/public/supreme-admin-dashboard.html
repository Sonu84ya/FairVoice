<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme Administrator Dashboard · Safe Reporting Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dash-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div class="topbar">
      <div>
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰ Menu</button>
        <h1 id="pageTitle">Escalated to Me</h1>
        <p class="sub" id="pageSub">Cases the Administrator level could not resolve.</p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">In Your Queue</div><div class="stat-value" id="statQueue">—</div></div>
      <div class="stat-card accent"><div class="stat-label">High / Critical</div><div class="stat-value" id="statHigh">—</div></div>
      <div class="stat-card"><div class="stat-label">Resolved by You</div><div class="stat-value" id="statResolved">—</div></div>
      <div class="stat-card"><div class="stat-label">Platform-wide Reports</div><div class="stat-value" id="statTotal">—</div></div>
    </div>

    <div id="viewQueue" class="view">
      <div class="panel">
        <div class="panel-head"><h2>Escalated to Me</h2></div>
        <div id="queueMount"><div class="loader"><div class="spinner"></div> Loading…</div></div>
      </div>
    </div>

    <div id="viewAll" class="view" style="display:none;">
      <div class="panel">
        <div class="panel-head"><h2>All Reports</h2></div>
        <div class="filter-tabs" id="allFilterTabs"></div>
        <div id="allMount"><div class="loader"><div class="spinner"></div> Loading…</div></div>
      </div>
    </div>

    <div id="viewStaff" class="view" style="display:none;">
      <div class="panel" style="max-width:520px;">
        <div class="panel-head"><h2>Create Staff Account</h2></div>
        <div class="form-error" id="staffError"></div>
        <form id="createStaffForm">
          <div class="field"><label for="staffName">Full name</label><input type="text" id="staffName" required></div>
          <div class="field"><label for="staffEmail">Work email</label><input type="email" id="staffEmail" required></div>
          <div class="field"><label for="staffDepartment">Department</label><input type="text" id="staffDepartment"></div>
          <div class="field"><label for="staffRole">Role</label>
            <select id="staffRole" required>
              <option value="admin">Administrator</option>
              <option value="supreme_admin">Supreme Administrator</option>
              <option value="ngo">NGO / INGO</option>
            </select>
          </div>
          <div class="field"><label for="staffPassword">Temporary password</label><input type="password" id="staffPassword" required minlength="8"></div>
          <button type="submit" class="btn btn-primary" id="createStaffBtn">Create staff account</button>
        </form>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Existing Staff</h2></div>
        <div id="staffMount"><div class="loader"><div class="spinner"></div> Loading…</div></div>
      </div>
    </div>

    <div id="viewResources" class="view" style="display:none;">
      <div class="panel">
        <div class="panel-head"><h2>Support Resources</h2></div>
        <div id="resourceMount"><div class="loader"><div class="spinner"></div> Loading…</div></div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard-common.js"></script>
<script src="js/staff-dashboard.js"></script>
<script>
  initStaffDashboard({
    role: 'supreme_admin',
    canEscalate: true,
    escalateLabel: 'NGO / INGO',
    canLegalAction: false
  });
</script>
</body>
</html>
