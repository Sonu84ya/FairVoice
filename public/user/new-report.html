<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fair Voice | New Report</title>

    <link rel="stylesheet" href="../dashboard.css">
    <link rel="stylesheet" href="/public/user/css/user.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>


<!-- Sidebar -->

<aside class="sidebar">

    <div class="logo">
        <i class="fa-solid fa-scale-balanced"></i>
        Fair Voice
    </div>


    <ul class="menu">

        <li>
            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </li>


        <li class="active">
            <a href="new-report.html">
                <i class="fa-solid fa-file-circle-plus"></i>
                New Report
            </a>
        </li>


        <li>
            <a href="my-reports.html">
                <i class="fa-solid fa-folder-open"></i>
                My Reports
            </a>
        </li>


        <li>
            <a href="notifications.html">
                <i class="fa-solid fa-bell"></i>
                Notifications
            </a>
        </li>


        <li>
            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Profile
            </a>
        </li>


        <li>
            <a href="../logout.html">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </li>

    </ul>


</aside>



<!-- Main Content -->

<main class="main">


<header class="topbar">

    <h2>
        File New Report
    </h2>


    <div class="profile">

        <img src="../assets/images/user.png">

        <span>
            Bhaskar
        </span>

    </div>


</header>



<section class="report-container">


<div class="report-card">


<h2>
<i class="fa-solid fa-pen-to-square"></i>
Create New Report
</h2>


<form>


<div class="input-group">

<label>
Report Category
</label>

<select>

<option>Select Category</option>
<option>Gender Harassment</option>
<option>Workplace Abuse</option>
<option>Discrimination</option>
<option>Safety Issue</option>
<option>Other</option>

</select>

</div>




<div class="input-group">

<label>
Report Title
</label>

<input 
type="text"
placeholder="Enter report title">

</div>




<div class="input-group">

<label>
Description
</label>

<textarea 
placeholder="Explain your issue clearly"></textarea>

</div>




<div class="row">


<div class="input-group">

<label>
Location
</label>

<input 
type="text"
placeholder="Enter location">

</div>



<div class="input-group">

<label>
Priority
</label>

<select>

<option>Normal</option>
<option>Urgent</option>
<option>Critical</option>

</select>

</div>


</div>




<div class="input-group">

<label>
Upload Evidence
</label>

<input 
type="file">

</div>



<button class="submit-btn">

<i class="fa-solid fa-paper-plane"></i>

Submit Report

</button>



</form>


</div>


</section>


</main>


</body>
</html>
